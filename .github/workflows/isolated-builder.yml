name: Isolated Build & Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'owner/repo a construir (vacio = este mismo repo)'
        required: false
        default: ''
      ref:
        description: 'branch/tag/commit a construir'
        required: false
        default: 'main'
      compose_file:
        description: 'Ruta al docker-compose.yml dentro del repo'
        required: false
        default: 'docker-compose.yml'
      smoke_url:
        description: 'URL local a la que pegarle para el smoke test'
        required: false
        default: 'http://localhost:3000/health'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (repo objetivo)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo != '' && inputs.target_repo || github.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.target_repo != '' && secrets.CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar docker-compose
        run: docker compose -f "${{ inputs.compose_file }}" config

      - name: Build imagen(es)
        run: docker compose -f "${{ inputs.compose_file }}" build

      - name: Levantar contenedor(es)
        run: docker compose -f "${{ inputs.compose_file }}" up -d

      - name: Esperar a que el servicio responda
        run: |
          for i in $(seq 1 15); do
            if curl -sf "${{ inputs.smoke_url }}" > /dev/null; then
              echo "Servicio arriba"; exit 0
            fi
            sleep 2
          done
          echo "Timeout esperando el servicio"; exit 1

      - name: Smoke test
        run: |
          curl -sf "${{ inputs.smoke_url }}" || {
            echo "--- LOGS ---"
            docker compose -f "${{ inputs.compose_file }}" logs
            exit 1
          }

      - name: Destruir entorno (siempre)
        if: always()
        run: docker compose -f "${{ inputs.compose_file }}" down -v --remove-orphans
